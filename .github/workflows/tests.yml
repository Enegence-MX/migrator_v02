name: Tests

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - master
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.2']

    name: PHP ${{ matrix.php-version }} Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom, fileinfo, pdo, pdo_mysql, oci8
          coverage: xdebug

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Copy environment file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate application key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Unit Tests
        run: ./vendor/bin/phpunit --testsuite Unit --colors=always

      - name: Run Tests with Coverage (app/Http only)
        run: ./vendor/bin/phpunit --testsuite Unit --coverage-text --coverage-clover=coverage/clover.xml --coverage-html=coverage/html

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/clover.xml
            coverage/html
          retention-days: 30

      - name: Extract Coverage Percentage
        if: always()
        id: coverage
        run: |
          if [ -f coverage/clover.xml ]; then
            # Extract coverage percentage from clover.xml
            coverage=$(php -r '
              $xml = simplexml_load_file("coverage/clover.xml");
              $metrics = $xml->project->metrics;
              $elements = (int)$metrics["elements"];
              $coveredelements = (int)$metrics["coveredelements"];
              if ($elements > 0) {
                  $percentage = round(($coveredelements / $elements) * 100, 2);
                  echo $percentage;
              } else {
                  echo "0";
              }
            ')
            echo "coverage=$coverage" >> $GITHUB_OUTPUT
            echo "Coverage: $coverage%"

            # Determine badge color
            if (( $(echo "$coverage >= 80" | bc -l) )); then
              color="brightgreen"
            elif (( $(echo "$coverage >= 60" | bc -l) )); then
              color="yellow"
            elif (( $(echo "$coverage >= 40" | bc -l) )); then
              color="orange"
            else
              color="red"
            fi
            echo "color=$color" >> $GITHUB_OUTPUT
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
            echo "color=lightgrey" >> $GITHUB_OUTPUT
          fi

      - name: Create Coverage Badge
        if: always() && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: migrator-v02-coverage.json
          label: coverage (app/Http)
          message: ${{ steps.coverage.outputs.coverage }}%
          color: ${{ steps.coverage.outputs.color }}

      - name: Display Coverage Summary
        if: always()
        run: |
          if [ -f coverage/clover.xml ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Code Coverage Report (app/Http)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Coverage: ${{ steps.coverage.outputs.coverage }}%"
            echo "  Color: ${{ steps.coverage.outputs.color }}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "✓ Coverage report generated successfully"
            echo "📊 Download the 'coverage-report' artifact to view detailed HTML report"
            echo ""
            if [ -z "${{ secrets.GIST_SECRET }}" ] || [ -z "${{ secrets.GIST_ID }}" ]; then
              echo "⚠️  Coverage badge not configured yet"
              echo "📖 To configure coverage badge, see GitHub Actions secrets setup"
            else
              echo "✓ Coverage badge updated successfully"
            fi
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            storage/logs
            tests/results

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const color = '${{ steps.coverage.outputs.color }}';

            const colorEmoji = {
              'brightgreen': '🟢',
              'yellow': '🟡',
              'orange': '🟠',
              'red': '🔴',
              'lightgrey': '⚪'
            };

            const body = `## 📊 Code Coverage Report

            ${colorEmoji[color] || '📊'} **Coverage:** ${coverage}%

            <details>
            <summary>View Coverage Details</summary>

            - Coverage badge color: \`${color}\`
            - Download the \`coverage-report\` artifact for detailed HTML report
            - Unit tests: ${coverage}% of app/Http code

            </details>

            ---
            *This comment is automatically generated by GitHub Actions*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Code Coverage Report');
            });

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
